name: CI

on:
  pull_request:
  push:
    # (28/10) os branches de trabalho também: os andares do Prédio LU2CA testam aqui,
    # nas máquinas do GitHub, e o Mac fica só com os testes que precisam de placa de vídeo
    branches: [main, "feature/**", "area/**"]
  schedule:
    - cron: "0 9 * * 1"

# um envio novo no mesmo branch cancela o teste do envio anterior
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  qualidade:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      - name: Tipos
        run: bunx tsc --noEmit

      - name: Dependências explicadas
        run: node scripts/gerar-dependencias.mjs --check

      - name: Vulnerabilidades em produção
        run: bun audit --prod
        # nos branches de trabalho só avisa (a correção é uma tarefa própria); no main barra
        continue-on-error: ${{ github.ref != 'refs/heads/main' }}

      - name: Modelos 3D dentro do orçamento
        run: node scripts/verificar-modelos.mjs

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Navegador pro teste
        run: bunx playwright install --with-deps chromium

      - name: Teste de fumaça
        # sem os testes que dirigem a cena 3D (precisam de placa de vídeo: rodam no Mac, com --use-angle=metal)
        run: bunx playwright test tests/fumaca.spec.ts tests/partes.spec.ts tests/portas.spec.ts tests/caderno.spec.ts tests/oficina.spec.ts tests/rotatoria.spec.ts

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-resultado
          path: test-results/
          retention-days: 7

  segredos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
